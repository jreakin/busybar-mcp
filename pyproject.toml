[project]
name = "busybar-mcp"
version = "0.1.0"
description = "MCP server for building BUSY Bar apps — draw, preview, upload assets, and inspect the device from an AI coding agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "busy-bar", "busylib", "flipper", "led", "model-context-protocol"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = [
    "busylib>=1.3.0",
    "fastmcp>=3.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
busybar-mcp = "busybar_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jreakin/busybar-mcp"
"Device API" = "https://docs.busy.app/bar/dev"
"Official Python library" = "https://github.com/busy-app/busylib-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busybar_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
