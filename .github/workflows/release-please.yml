name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          release-type: python
          # The default GITHUB_TOKEN cannot trigger other workflows (GitHub's own loop-
          # prevention), so a release PR opened with it won't run this repo's required CI
          # checks. Create a fine-grained PAT or GitHub App installation token, add it as
          # the RELEASE_PLEASE_TOKEN repo secret, and it'll be used automatically; falls
          # back to GITHUB_TOKEN (release PR created, but without triggering CI) until then.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

